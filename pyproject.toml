[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = [ "croniter", "networkx", "networkx.*", "pyvis.*", "community",]
ignore_missing_imports = true

[tool.importlinter]
root_package = "llmwikify"
include_external_packages = true
contracts = []

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
llmwikify = [ "py.typed",]
"llmwikify.foundation.templates" = [ "*.json", "_gitignore", "skill_llmwikify/*.md", "skill_llmwikify/resources/*.md",]
"llmwikify.foundation.prompts._defaults" = [ "*.yaml",]
"llmwikify.foundation.llm" = [ "providers.yaml",]  # v0.41: Provider 元数据唯一来源
"llmwikify.apps.chat" = [ "config_defaults.yaml",]  # v0.41: Chat 业务默认值
"llmwikify.apps.research" = [ "config_defaults.yaml",]  # v0.41: Research 业务默认值
"llmwikify.apps.chat.skills.workflows.builtins" = [ "*.yaml", "actor_prompts/*.md",]

[tool.ruff.lint]
select = [ "E", "F", "I", "W", "B", "C4", "UP",]
ignore = [ "E501", "B904", "F401",]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends() 在参数默认值中是官方惯例 (wiki_routes.py 等)
extend-immutable-calls = [ "fastapi.Depends",]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [ "tests",]
python_files = [ "test_*.py",]
python_functions = [ "test_*",]
addopts = "-v --tb=short --strict-markers --ignore=tests/ab_testing --ignore=tests/e2e -m 'not llm'"
asyncio_mode = "auto"
markers = [
  "e2e: end-to-end tests that start a real server (run with `pytest -m e2e`)",
  "mock: unit tests using mocks only, no real I/O (default, always run)",
  "integration: integration tests with real DB/H5 (run on push to main)",
  "llm: tests requiring real LLM API (gated by GHA secret, only main + nightly)",
  "slow: tests taking >10s (excluded from quick runs)",
  "requires_server: tests requiring a running llmwikify server (auto-skipped when SERVER_URL unreachable)",
]

[tool.coverage.run]
branch = true
source = [ "src/llmwikify",]

[tool.coverage.report]
# fail_under 渐进提升: 15% (mock-only) → 50% (mock + 集成) → 80% (refactor 完成后)
# 当前 16.27% (mock-only 测试 112 个), 已通过 15% 门槛
# 真实代码覆盖率需 behavior + 集成测试, refactor Phase 14 后达到 80%
fail_under = 15
show_missing = true
exclude_lines = [ "pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:",]

[tool.setuptools.packages.find]
where = [ "src",]
include = [ "llmwikify*",]

[tool.ruff.lint.per-file-ignores]
"src/llmwikify/apps/chat/research_engine/actions.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/engine.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/gates.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/observer.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/reasoner.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/report.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/resume.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/routes.py" = [ "E701",]
"src/llmwikify/apps/chat/research_engine/llm_step.py" = [ "E701",]
